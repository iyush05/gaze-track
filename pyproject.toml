[project]
name = "gaze-track"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=1.2.0",
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "onnxscript>=0.7.2",
    "scipy>=1.18.1",
    "timm>=1.0.30",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
