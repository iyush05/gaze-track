name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for OpenCV / MediaPipe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libgles2

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (CPU-only PyTorch on Linux)
        run: uv sync --frozen

      - name: Download MediaPipe models (checksum-verified)
        run: uv run python -m gaze_track download-models --no-gaze

      - name: Run tests
        run: uv run pytest -q
