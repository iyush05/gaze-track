name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for OpenCV / MediaPipe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libgles2

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (CPU-only PyTorch on Linux)
        run: uv sync --frozen

      - name: Download MediaPipe models (checksum-verified)
        run: uv run python -m gaze_track download-models --no-gaze

      # The training tests run in their own process: the tiny training test intermittently aborted inside
      # PyTorch's CPU backward on Linux runners when it shared a process with the MediaPipe / OpenCV tests.
      - name: Run model training tests
        env:
          OMP_NUM_THREADS: "1"
        run: uv run pytest -q tests/test_learn.py

      - name: Run remaining tests
        env:
          OMP_NUM_THREADS: "1"
        run: uv run pytest -q --ignore=tests/test_learn.py
